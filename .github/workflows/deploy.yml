name: Deploy to 1Panel Server

on:
  push:
    branches:
      - main  # Change to 'master' if your default branch is master

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: SSH Remote Execution
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script_stop_on_error: true
          script: |
            # Navigate to your project directory on 1Panel
            cd /opt/1panel/docker/compose/delivrili

            # Fetch and pull latest changes from GitHub
            git fetch origin
            git reset --hard origin/main

            # Rebuild and restart Docker containers cleanly
            docker compose down
            docker compose up -d --build